- title: "Microbial imprinting of the airway epithelium"
  authors: "<b>van de Ven, J. J. I.</b>, Amatngalim, G. D., Garssen, J., Netea, M. G., & <b>Perdijk, O.</b>"
  venue: "Cell Reports, 45(8), Article 117705 (2026)"
  link: "https://www.cell.com/cell-reports/fulltext/S2211-1247(26)00783-7"
  highlight: "In this review, we discuss this emerging concept of microbial imprinting of the airway epithelium and propose a conceptual framework comprised of four categories:
      altered differentiation, tolerance, priming and trained immunity.
      We also highlight how understanding these long-term epithelial adaptations may open new avenues for preventing and treating inflammatory airway diseases."

- title: "Antibiotic-driven dysbiosis in early life disrupts indole-3-propionic acid production and exacerbates allergic airway inflammation in adulthood"
  authors: "Perdijk, O., Butler, A., Macowan, M., Chatzis, R., Bulanda, E., Grant, R. D., Harris, N. L., Wypych, T. P., & Marsland, B. J."
  venue: "Immunity, 57(8), 1939-1954.e7 (2024)"
  link: "https://www.cell.com/immunity/fulltext/S1074-7613(24)00316-9"
  highlight: "We identified a novel a novel mechanism through which early-life antibiotics use impacts on the airway epithelium and predisposes mice to allergy into adulthood. This work received attention from international news stations and newspapers, including the NRC and Herald-Sun, main international news outlets (e.g. Sky news, ABC news and 7-news) and was highlighted in Nature Reviews Immunology (Bird et al, 2024) and Immunity (Ionescu et al, 2024)."

- title: "The microbiome: an integral player in immune homeostasis and inflammation in the respiratory tract"
  authors: "Perdijk, O., Azzoni, R., & Marsland, B. J."
  venue: "Physiological Reviews, 104(2), 835-879 (2024)"
  link: "https://journals.physiology.org/doi/full/10.1152/physrev.00020.2023"
  highlight: "In this comprehensive review we highlight the role of the gut and lung microbiome in modulating immune responses in the respiratory tract. The review discusses preclinical and clinical studies and highlight the mechanisms of action through which microbes’ impact on respiratory health."
